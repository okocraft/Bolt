version: 0
language: ja
settings:
  use-action-bar: false
protections:
  private:
    default: true
    require-permission: false
    allows: []
  display:
    require-permission: false
    allows:
    - interact
    - open
  deposit:
    require-permission: false
    allows:
    - interact
    - open
    - deposit
  withdrawal:
    require-permission: false
    allows:
    - interact
    - open
    - withdraw
  public:
    require-permission: false
    allows:
    - interact
    - open
    - deposit
    - withdraw
    - mount
access:
  normal:
    default: true
    require-permission: false
